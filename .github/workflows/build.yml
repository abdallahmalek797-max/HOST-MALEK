
name: Build HOST MALEK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HOST_MALEK_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q HOST_MALEK_source.zip -d project
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Configure Chaquopy ABI
        run: |
          python3 - <<'PY'
          import os
          import re

          path = os.path.join(
              os.environ["PROJECT_DIR"], "app", "build.gradle"
          )

          with open(path, "r") as f:
              content = f.read()

          if not re.search(r'\babiFilters\b', content):
              pattern = r'(defaultConfig\s*\{)'
              replacement = r'''\1
                  ndk {
                      abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
                  }'''

              content, count = re.subn(pattern, replacement, content, count=1)

              if count == 0:
                  raise SystemExit("Could not find defaultConfig in build.gradle")

              with open(path, "w") as f:
                  f.write(content)

          print("Chaquopy ABI configuration checked.")

          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOST-MALEK-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
