
name: Build HOST MALEK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HOST_MALEK_source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q HOST_MALEK_source.zip -d project
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Fix Android configuration
        run: |
          python3 - <<'PY'
          import os
          import re

          path = os.path.join(os.environ["PROJECT_DIR"], "app", "build.gradle")

          with open(path) as f:
              content = f.read()

          android = re.search(r'\bandroid\s*\{', content)
          default = re.search(r'\bdefaultConfig\s*\{', content)

          if not android or not default:
              raise SystemExit("Android configuration not found")

          if not re.search(r'\bcompileOptions\s*\{', content):
              pos = android.end()
              content = content[:pos] + """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          """ + content[pos:]

          default = re.search(r'\bdefaultConfig\s*\{', content)

          if not re.search(r'\babiFilters\b', content):
              pos = default.end()
              content = content[:pos] + """
              ndk {
                  abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
              }
          """ + content[pos:]

          with open(path, "w") as f:
              f.write(content)

          print("Android configuration fixed")
          PY

      - name: Fix AlertDialog import
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          files = list(root.glob("app/src/main/java/**/MainActivity.kt"))

          if not files:
              raise SystemExit("MainActivity.kt not found")

          path = files[0]
          content = path.read_text()

          if "import android.app.AlertDialog" not in content:
              lines = content.splitlines()
              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      lines.insert(i + 1, "")
                      lines.insert(i + 2, "import android.app.AlertDialog")
                      break
              else:
                  raise SystemExit("Package declaration not found")

              path.write_text("\n".join(lines) + "\n")

          print("AlertDialog import checked")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOST-MALEK-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
